<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="混沌幻世">
<title>混沌幻世 Realm of Chaos — 本機網頁版</title>
<style>
  html,body{margin:0;height:100%;background:#000;color:#c0c0c0;}
  body{position:fixed;inset:0;height:var(--vh,100dvh);display:flex;flex-direction:column;font-family:"MingLiU","細明體","Noto Sans Mono CJK TC","Sarasa Mono TC",Consolas,monospace;font-size:16px;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);box-sizing:border-box;-webkit-text-size-adjust:100%;}
  #term{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:6px 10px;white-space:pre-wrap;word-break:break-all;line-height:1.25;font-size:var(--fs,16px);}
  #bar{display:flex;border-top:1px solid #333;background:#111;}
  #cmd{flex:1;min-width:0;background:#000;color:#fff;border:0;outline:0;padding:8px 10px;font:inherit;font-size:16px;}
  #cmd::placeholder{color:#555}
  body.touch #cmd{background:#1a1a1a;margin:4px;border:1px solid #444;border-radius:4px;padding:6px 8px}
  #bar button,#keys button{background:#222;color:#aaa;border:0;border-left:1px solid #333;padding:0 10px;font:inherit;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;}
  #bar button:hover{color:#fff}
  #bar button:active,#keys button:active{background:#444;color:#fff}
  #bSend{color:#ff5!important}
  /* 手機快捷鍵 */
  #keys{display:none;background:#111;border-top:1px solid #333;padding:4px;gap:4px;font-size:15px}
  body.touch #keys.on{display:flex}
  #keys .dir{display:grid;grid-template-columns:repeat(3,2.6em);grid-auto-rows:2.3em;gap:3px}
  #keys .cmds{flex:1;display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:2.3em;gap:3px;align-content:start}
  #keys button{border:1px solid #333;border-radius:4px;padding:0}
  #keys .dir button{color:#5ff}
  #keys .dir .ud{color:#ff5}
  .tools{display:none}
  @media (max-width:700px){
    #bar button{padding:0 8px}
    .wide{display:none}
    .tools{display:inline-block}
  }
  .b{font-weight:bold}
  .c30{color:#000}.c31{color:#a00}.c32{color:#0a0}.c33{color:#a50}.c34{color:#00a}.c35{color:#a0a}.c36{color:#0aa}.c37{color:#c0c0c0}
  .b.c30{color:#555}.b.c31{color:#f55}.b.c32{color:#5f5}.b.c33{color:#ff5}.b.c34{color:#55f}.b.c35{color:#f5f}.b.c36{color:#5ff}.b.c37{color:#fff}
  .g40{background:#000}.g41{background:#a00}.g42{background:#0a0}.g43{background:#a50}.g44{background:#00a}.g45{background:#a0a}.g46{background:#0aa}.g47{background:#aaa}
  /* 狀態血條 */
  #stat{display:none;gap:4px;padding:4px 6px;background:#0a0a0a;border-bottom:1px solid #333;font-size:12px;align-items:center}
  #stat.on{display:flex}
  .sb{flex:1;position:relative;height:18px;background:#222;border-radius:3px;overflow:hidden;min-width:0}
  .sb i{position:absolute;inset:0 auto 0 0;transition:width .3s}
  .sb span{position:relative;display:block;text-align:center;line-height:18px;color:#fff;text-shadow:0 0 2px #000,0 0 2px #000;white-space:nowrap;overflow:hidden}
  .sb.hp i{background:#a00}.sb.mp i{background:#00a}.sb.mv i{background:#070}
  .si{flex:0 1 auto;color:#aaa;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:34%}
  .si b{color:#f55}
  .sb .lb{font-weight:normal}
  @media (max-width:500px){#stat.fight .sb .lb{display:none}}
  /* 物品／裝備面板 */
  #sheet{display:none;flex-direction:column;max-height:58%;background:#111;border-top:2px solid #444;font-size:15px}
  #sheet.on{display:flex}
  #sheet .tabs{display:flex;border-bottom:1px solid #333}
  #sheet .tabs button{flex:1;padding:8px 0;background:#181818;color:#888;border:0;border-right:1px solid #333;font:inherit}
  #sheet .tabs button.cur{background:#2a2a2a;color:#ff5}
  #sheet .tabs .x{flex:0 0 3em;color:#f55}
  #sheet .body{overflow-y:auto;-webkit-overflow-scrolling:touch;flex:1}
  #sheet .top{display:flex;align-items:center;gap:8px;padding:6px 8px;border-bottom:1px solid #222;position:sticky;top:0;background:#111}
  #sheet .it{border-bottom:1px solid #222}
  #sheet .ih{display:flex;gap:8px;padding:9px 10px;align-items:baseline;cursor:pointer}
  #sheet .it.open{background:#1c1c1c}
  #sheet .it.open .ih .nm{color:#ff5}
  #sheet .nm{flex:1;color:#ddd;min-width:0;overflow-wrap:anywhere}
  #sheet .nm.hi{color:#a55}
  #sheet .nm em{color:#5ff;font-style:normal}
  #sheet .tg{color:#777;font-size:13px;white-space:nowrap}
  #sheet .sl{color:#0aa;width:4.5em;flex:0 0 auto}
  #sheet .empty .nm{color:#444}
  #sheet .empty .ih{padding:3px 10px;font-size:13px}
  body.sheet-on #keys.on{display:none}
  #sheet .ia{display:flex;flex-wrap:wrap;gap:6px;padding:0 10px 10px}
  #sheet button{background:#2a2a2a;color:#ccc;border:1px solid #444;border-radius:4px;padding:6px 12px;font:inherit;font-size:14px;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
  #sheet button:active{background:#555}
  #sheet button.pri{color:#5f5;border-color:#363}
  #sheet button.warn{color:#f77;border-color:#633}
  #sheet .hint{color:#777;font-size:13px;width:100%}
  #sheet .top .hint{width:auto;flex:1;text-align:right}
  #sheet .pad{padding:16px}
  #sheet .sub{width:100%;border-left:2px solid #333;padding-left:8px;display:flex;flex-direction:column;gap:4px}
  #sheet .subi{display:flex;align-items:center;gap:8px}
  #sheet .subi span{flex:1}
  #sheet .nm small{color:#666;font-size:12px}
  #sheet .sec{padding:6px 10px 2px;color:#ff5;font-size:13px;background:#0c0c0c;border-bottom:1px solid #222}
  #sheet .grid{display:flex;flex-wrap:wrap;gap:6px;padding:8px 10px}
  #sheet .grid button.cur{background:#444;color:#ff5}
  #sheet .grid.soc button{padding:5px 8px;font-size:13px}
  #sheet .argrow{width:100%;display:flex;flex-wrap:wrap;gap:6px;padding:6px;background:#1c1c1c;border:1px solid #333;border-radius:4px;box-sizing:border-box}
  #keys .cmds.combat button{color:#ddd}
  #keys .cmds.combat button.warn{color:#f77;border-color:#633}
  #keys .cmds.combat button.sp{color:#9cf;border-color:#335}
  #keys .cmds.combat button.heal{color:#5f5;border-color:#363}
  #keys .cmds.combat button.dis{opacity:.4}
  #keys .cmds.combat{outline:1px solid #622;outline-offset:1px}
  #sheet .pas{display:flex;flex-wrap:wrap;gap:4px 12px;padding:8px 10px;color:#777;font-size:13px}
  #sheet button.pin{color:#fc5;border-color:#553}
  /* 快捷列（釘選） */
  #pins{display:none;gap:4px;padding:4px;background:#111;border-top:1px solid #333;overflow-x:auto;-webkit-overflow-scrolling:touch}
  #pins.on{display:flex}
  #pins button{flex:0 0 auto;min-width:3.6em;height:2.4em;background:#1d1d2a;color:#9cf;border:1px solid #335;border-radius:4px;font:inherit;font-size:14px;padding:0 8px;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
  #pins button small{display:block;font-size:10px;color:#77a;line-height:1}
  #pins button.dis{opacity:.4}
  #pins button:active{background:#335}
  /* 可點的文字 */
  #term .lk{text-decoration:underline dotted #666;text-underline-offset:3px;cursor:pointer}
  #term .lk:active{background:#333}
  /* 可點文字依種類上色：怪物橘、玩家粉紫、物品綠、指令／出口青 */
  #term .lk.mob{color:#fa5;text-decoration-color:#a63}
  #term .lk.pc{color:#e8f;text-decoration-color:#859}
  #term .lk.obj{color:#7e7;text-decoration-color:#474}
  #term .lk.cmd{color:#5ff;text-decoration-color:#277}
  #term .lk.ex{color:#ee8;text-decoration-color:#775}
  /* 點文字跳出的動作選單 */
  #pop{display:none;position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.45);align-items:flex-end}
  #pop.on{display:flex}
  #pop .pp{width:100%;max-height:70%;overflow-y:auto;background:#151515;border-top:2px solid #555;padding:8px 10px calc(10px + env(safe-area-inset-bottom));box-sizing:border-box;font-size:15px}
  #pop .pt{color:#ff5;margin:6px 0 4px}
  #pop .pt small{color:#777;font-size:12px}
  #pop .pa{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
  #pop button{background:#2a2a2a;color:#ccc;border:1px solid #444;border-radius:4px;padding:7px 12px;font:inherit;font-size:14px;touch-action:manipulation}
  #pop button.pri{color:#5f5;border-color:#363}#pop button.warn{color:#f77;border-color:#633}#pop button.dis{opacity:.45}
  #pop button small{color:#77a;font-size:11px}
  #pop .px{width:100%;margin-top:4px;color:#888}
  #pop .hint{color:#777}
  /* 登入選項 */
  #choices{display:none;flex-wrap:wrap;gap:6px;padding:6px;background:#111;border-top:1px solid #333;font-size:15px;max-height:40%;overflow-y:auto}
  #choices.on{display:flex}
  #choices button{background:#222;color:#ddd;border:1px solid #444;border-radius:4px;padding:8px 12px;font:inherit;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
  #choices button small{display:block;color:#777;font-size:11px}
  #choices button.pri{color:#5f5;border-color:#363}
  #choices .wide1{flex:1}
  #choices .hint{width:100%;color:#888;font-size:13px}
  body.touch:not(.playing) #keys.on{display:none}
  .blink{animation:bl 1s step-start infinite}@keyframes bl{50%{opacity:0}}
</style>
</head>
<body>
<div id="stat"></div>
<div id="term"></div>
<div id="sheet">
  <div class="tabs"><button data-tab="inv">物品</button><button data-tab="eq">裝備</button><button data-tab="room">地上</button><button data-tab="sk">技能</button><button data-tab="cmd">指令</button><button class="x" data-close>✕</button></div>
  <div class="body"></div>
</div>
<div id="pop"><div class="pp"><div class="pb"></div><button class="px" data-x>關閉</button></div></div>
<div id="choices"></div>
<div id="pins"></div>
<div id="keys">
  <div class="dir">
    <button data-c="up" class="ud">上</button><button data-c="north">北</button><button data-c="look">看</button>
    <button data-c="west">西</button><button data-c="">↵</button><button data-c="east">東</button>
    <button data-c="down" class="ud">下</button><button data-c="south">南</button><button data-c="scan">掃</button>
  </div>
  <div class="cmds">
    <button data-c="score">狀態</button><button data-ui="inv">物品</button><button data-ui="eq">裝備</button><button data-c="exits">出口</button>
    <button data-ui="kill">攻擊…</button><button data-c="flee">逃跑</button><button data-ui="sk">技能</button><button data-ui="room">地上</button>
    <button data-c="rest">休息</button><button data-c="sleep">睡覺</button><button data-c="wake">醒來</button><button data-c="stand">站起</button>
    <button data-ui="cmd">指令…</button><button data-c="who">誰在</button><button data-c="say " data-fill>說話…</button><button data-c="save">存檔</button>
  </div>
</div>
<div id="bar">
  <input id="cmd" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="send" placeholder="輸入指令…" autofocus>
  <button id="bSend" title="送出">送出</button>
  <button id="bKeys" class="tools" title="快捷鍵">鍵盤</button>
  <button id="bFont" class="tools" title="字體大小">字</button>
  <button id="bBag" class="wide" title="物品／裝備">物品</button>
  <button id="bExport" class="wide" title="匯出存檔">匯出</button>
  <button id="bImport" class="wide" title="匯入存檔">匯入</button>
  <button id="bSim" class="wide" title="模擬線上玩家／頻道">模擬:開</button>
  <button id="bMore" class="tools" title="更多">⋯</button>
</div>
<input type="file" id="fImport" accept=".json" style="display:none">
<script>
/* ===== ANSI → HTML 終端機 ===== */
(function(){
  const term=document.getElementById('term');
  let st={b:false,fg:37,bg:40,bl:false};
  const MAX=4000;
  function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
  function span(t){
    if(!t) return '';
    const c=[];
    if(st.b)c.push('b'); if(st.fg!==37||st.b)c.push('c'+st.fg); if(st.bg!==40)c.push('g'+st.bg); if(st.bl)c.push('blink');
    const h=Term.linkify?Term.linkify(esc(t)):esc(t);
    return c.length?'<span class="'+c.join(' ')+'">'+h+'</span>':h;
  }
  function sgr(p){
    const a=p===''?[0]:p.split(';').map(Number);
    for(const n of a){
      if(n===0){st={b:false,fg:37,bg:40,bl:false};}
      else if(n===1)st.b=true; else if(n===22)st.b=false;
      else if(n===5)st.bl=true; else if(n===25)st.bl=false;
      else if(n>=30&&n<=37)st.fg=n; else if(n===39)st.fg=37;
      else if(n>=40&&n<=47)st.bg=n; else if(n===49)st.bg=40;
    }
  }
  window.Term={
    write(s){
      s=String(s).replace(/\r/g,'');
      let out='',i=0;
      const re=/\x1b\[([0-9;]*)([A-Za-z])/g; let m;
      while((m=re.exec(s))){
        out+=span(s.slice(i,m.index));
        if(m[2]==='m')sgr(m[1]);
        else if(m[2]==='J'){term.innerHTML='';out='';}
        i=re.lastIndex;
      }
      out+=span(s.slice(i));
      const atBottom=term.scrollHeight-term.scrollTop-term.clientHeight<40;
      term.insertAdjacentHTML('beforeend',out);
      while(term.childNodes.length>MAX)term.removeChild(term.firstChild);
      if(atBottom||true)term.scrollTop=term.scrollHeight;
    },
    clear(){term.innerHTML='';}
  };
})();

/* ===== 輸入列 ===== */
(function(){
  const cmd=document.getElementById('cmd');
  const hist=[];let hi=0,last='';
  window.Conn={
    handler:null,
    send(s){Term.write(s);},
    echo(on){cmd.type=on?'text':'password';if(!on&&document.body.classList.contains('touch'))cmd.focus();},
    onInput(fn){this.handler=fn;}
  };
  function submit(v,repeat){
    const pw=cmd.type==='password';
    if(v===''&&repeat&&!pw&&last)v=last;
    if(!pw){if(v&&hist[hist.length-1]!==v)hist.push(v);hi=hist.length;last=v;Term.write(v+'\n');}
    else Term.write('\n');
    if(Conn.handler)Conn.handler(v);
  }
  cmd.addEventListener('keydown',e=>{
    if(e.key==='Enter'&&!e.isComposing){
      const v=cmd.value;cmd.value='';submit(v,true);
    }else if(e.key==='ArrowUp'){if(hi>0){hi--;cmd.value=hist[hi];}e.preventDefault();}
    else if(e.key==='ArrowDown'){if(hi<hist.length){hi++;cmd.value=hist[hi]||'';}e.preventDefault();}
  });
  /* 手機：偵測觸控、按鈕不搶焦點（避免鍵盤一直跳出來） */
  const touch=matchMedia('(pointer:coarse)').matches||'ontouchstart' in window;
  if(touch){document.body.classList.add('touch');cmd.removeAttribute('autofocus');}
  const ls={get:k=>{try{return localStorage.getItem(k);}catch(e){return null;}},set:(k,v)=>{try{localStorage.setItem(k,v);}catch(e){}}};
  for(const b of document.querySelectorAll('#bar button'))
    b.addEventListener('pointerdown',e=>{if(b.id!=='bSend'||document.activeElement!==cmd)e.preventDefault();});
  document.getElementById('keys').addEventListener('pointerdown',e=>{if(e.target.closest('button'))e.preventDefault();});
  document.getElementById('bSend').onclick=()=>{const v=cmd.value;cmd.value='';submit(v,true);if(!touch)cmd.focus();};
  const keys=document.getElementById('keys');
  window.UI={send:c=>submit(c,c===''),raw:c=>submit(c,false),fill:c=>{cmd.value=c;cmd.focus();}};
  document.getElementById('bBag').onclick=()=>UIPanel.open('inv');
  /* 快捷鍵用事件委派：戰鬥模式會整組換掉按鈕 */
  keys.addEventListener('click',e=>{
    const b=e.target.closest('button');if(!b)return;
    if(b.dataset.ui){UIPanel.open(b.dataset.ui);return;}
    if(b.dataset.c===undefined)return;
    const c=b.dataset.c;
    if(cmd.type==='password'){cmd.focus();return;}
    if('fill' in b.dataset){cmd.value=c;cmd.focus();return;}
    submit(c,c==='');
  });
  const bk=document.getElementById('bKeys');
  const setKeys=on=>{keys.classList.toggle('on',on);bk.style.color=on?'#5f5':'';ls.set('roc.keys',on?'1':'0');Term.write('');};
  setKeys(ls.get('roc.keys')!=='0');
  bk.onclick=()=>{if(document.body.classList.contains('sheet-on')){UIPanel.close();setKeys(true);return;}setKeys(!keys.classList.contains('on'));};
  /* 字體大小：手機預設小一點，點「字」循環切換 */
  const sizes=[11,12,13,14,16,18];
  let fs=+ls.get('roc.fs')||(innerWidth<700?13:16);
  const setFs=v=>{fs=v;document.documentElement.style.setProperty('--fs',v+'px');ls.set('roc.fs',v);};
  setFs(fs);
  document.getElementById('bFont').onclick=()=>{const i=sizes.indexOf(fs);setFs(sizes[(i+1)%sizes.length]);Term.write('\x1b[1;30m[字體 '+fs+'px]\x1b[m\n');};
  /* 「⋯」展開匯出／匯入／模擬 */
  document.getElementById('bMore').onclick=()=>{for(const b of document.querySelectorAll('#bar .wide'))b.style.display=b.style.display==='inline-block'?'':'inline-block';};
  /* 虛擬鍵盤彈出時讓畫面跟著縮，輸入列不會被蓋住 */
  if(window.visualViewport){
    const fit=()=>{document.body.style.setProperty('--vh',visualViewport.height+'px');window.scrollTo(0,0);const t=document.getElementById('term');t.scrollTop=t.scrollHeight;};
    visualViewport.addEventListener('resize',fit);fit();
  }
  document.getElementById('term').addEventListener('click',()=>{if(!touch&&!getSelection().toString())cmd.focus();});
  document.getElementById('bExport').onclick=()=>ROC.Save&&ROC.Save.exportAll();
  document.getElementById('bImport').onclick=()=>document.getElementById('fImport').click();
  document.getElementById('fImport').onchange=e=>{const f=e.target.files[0];if(f)f.text().then(t=>ROC.Save.importAll(t));};
  const bs=document.getElementById('bSim');
  bs.onclick=()=>{ROC.simOn=!ROC.simOn;bs.textContent='模擬:'+(ROC.simOn?'開':'關');ls.set('roc.sim',ROC.simOn?'1':'0');};
  window.addEventListener('load',()=>{ROC.simOn=ls.get('roc.sim')!=='0';bs.textContent='模擬:'+(ROC.simOn?'開':'關');});
})();

/* ===== 載入器 ===== */
window.ROC={areaData:[],loadArea(a){this.areaData.push(a);}};
/* 改版時換這個號碼，手機才不會一直用舊的程式快取 */
const V='20261020c';
function loadScript(src){return new Promise((ok,ng)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=()=>ng(src);document.head.appendChild(s);});}
(async function(){
  Term.write('\x1b[1;30m載入核心資料...\x1b[m\n');
  try{
    await loadScript('data/core.js'); await loadScript('data/const.js'); await loadScript('data/skills.js'); await loadScript('data/index.js');
    for(const f of ['util','db','handler','act','save','info','move','obj','comm','fight','magic','spells_attack','spells_aid','spells_assist','spells_cure_obj','skill','skills_cmd','wiz','update','sim','interp','owner','nanny','mprog'])
      await loadScript('engine/'+f+'.js?v='+V);
    await loadScript('ui/panel.js?v='+V);UIPanel.init();
    const n=ROC.AREAS.length;let k=0;
    const bar=document.createElement('div');bar.style.color='#555';document.getElementById('term').appendChild(bar);
    const B=8;
    for(let i=0;i<n;i+=B){
      await Promise.all(ROC.AREAS.slice(i,i+B).map(a=>loadScript('data/areas/'+a.id+'.js').then(()=>{k++;})));
      const w=Math.round(k/n*30);bar.textContent='載入區域 ['+'█'.repeat(w)+'░'.repeat(30-w)+'] '+k+'/'+n;
    }
    await ROC.Store.init();
    Term.write(ROC.Store.mode==='folder'
      ?'\x1b[1;30m角色存檔：ROC網頁\\player\\ 資料夾\x1b[m\n'
      :'\x1b[1;33m角色存檔：瀏覽器 localStorage（換手機／清除瀏覽資料前請先「匯出」備份；電腦用「開始遊戲.cmd」開才會存進 player 資料夾）\x1b[m\n');
    ROC.boot(Conn);
